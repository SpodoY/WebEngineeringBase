name: Production Pipeline
run-name: ${{ github.actor }} triggered GitHub Pages deployment
on:
  push:
    branches:
      - 'production'

jobs:
  build:
    name: Setup pnpm and run linter
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5

      # Uses version defined in `package.json` since packageManager field ist set :)
      # We also don't run pnpm install here as we wait 4 node 4 the caching :D
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # We can use this since we specified the node version in the engines part of `package.json`
      # V5 also caches by default so we just provide cache: 'pnpm'
      # https://github.com/actions/setup-node
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      # Now we install - Cause now we caching real good uwu
      - name: Install dependencies
        run: pnpm install

      # Lint stuff
      - name: Run linter
        run: pnpm lint

      - name: Build application
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4